<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メモ</title>
<!-- メモのリンクの入口。LINEなどのカードを「メモ」にするためだけのページで、開くとすぐ本体（./）へ移る。
     メモの中身は「#」より後ろにあり、ここでもサーバーには届かない -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="つたえる帳">
<meta property="og:title" content="メモ">
<meta property="og:description" content="伝えたいことが、大きな字で見やすく書いてあります。そのまま印刷もできます。">
<meta property="og:image" content="https://yannsi.github.io/yotei-hyo/og-memo.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="メモ">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1d5a6e">
<link rel="icon" href="icon-192.png">
<style>
body{margin:0;background:#eef2f3;color:#1b2629;font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  display:grid;place-items:center;min-height:100vh;font-size:20px;text-align:center;padding:16px;box-sizing:border-box}
a{color:#1d5a6e;font-weight:700}
@media (prefers-color-scheme: dark){body{background:#121819;color:#e8eef0}a{color:#6fb6cc}}
</style>
</head>
<body>
<p>メモを開いています…<br><a id="go" href="./">開かないときはこちら</a></p>
<script>
// 本体へ。「#」より後ろ（メモの中身）はそのまま引き継ぐ
(function(){
  var to="./"+location.hash;
  document.getElementById("go").href=to;
  if(/memo\.html$/.test(location.pathname)) location.replace(to);
})();
</script>
</body>
</html>
